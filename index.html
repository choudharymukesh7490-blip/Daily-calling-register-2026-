<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Call Register 2026</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;color:#172338}main{max-width:800px;margin:auto;padding:12px}header{background:#1754b6;color:white;text-align:center;padding:20px;border-radius:12px}h1{font-size:24px;margin:0}section{background:white;padding:15px;margin:13px 0;border-radius:12px}input,button{font-size:16px;border-radius:8px;padding:12px}input{width:100%;border:1px solid #ccd5e2;margin:6px 0}button{background:#1754b6;color:white;border:0;font-weight:bold;cursor:pointer}.full{width:100%;margin-top:6px}.stats{display:flex;gap:5px}.stats span{flex:1;text-align:center;background:#edf3fa;padding:8px 2px;border-radius:8px;font-size:13px}.stats b{display:block;font-size:21px}.person{border:1px solid #d8e1ed;border-radius:10px;padding:12px;margin-top:10px}.person strong{font-size:18px}.sub{color:#5f6e80;font-size:14px;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:95px;padding:10px 4px}.green{background:#078346}.red{background:#c52929}.gray{background:#63748b}.chosen{outline:3px solid #172338;outline-offset:1px}small{color:#64748b}</style></head><body><main><header><h1>📞 Daily Call Register 2026</h1><p>नाम • गाँव • कॉल • रोज का रिकॉर्ड</p></header><section><h2>नया व्यक्ति जोड़ें</h2><form id="form"><input id="name" placeholder="व्यक्ति का नाम" required><input id="village" placeholder="गाँव का नाम" required><input id="phone" type="tel" placeholder="मोबाइल नंबर" required><button class="full">+ व्यक्ति जोड़ें</button></form></section><section><h2>कॉलिंग लिस्ट</h2><label>तारीख चुनें</label><input type="date" id="date"><div class="stats"><span><b id="total">0</b>कुल</span><span><b id="yes">0</b>🟢 बात हुई</span><span><b id="no">0</b>🔴 नहीं हुई</span><span><b id="left">0</b>बाकी</span></div><input id="search" placeholder="नाम, गाँव या नंबर खोजें"><div id="list"></div></section><section><h2>बैकअप</h2><button id="csv" class="full" type="button">CSV रिकॉर्ड डाउनलोड</button><button id="backup" class="full" type="button">पूरा JSON बैकअप</button><p><small>रिकॉर्ड इसी डिवाइस में सेव होंगे। ऐप हटाने या फोन बदलने से पहले बैकअप लें।</small></p></section></main><script>
(function(){const P='dcr2026_people_v2',L='dcr2026_logs_v2',g=id=>document.getElementById(id);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}let people=load(P,[]),logs=load(L,{});if(!Array.isArray(people))people=[];if(typeof logs!=='object'||Array.isArray(logs))logs={};function save(){try{localStorage.setItem(P,JSON.stringify(people));localStorage.setItem(L,JSON.stringify(logs));return true}catch(e){alert('डेटा सेव नहीं हुआ');return false}}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}g('date').value=today();function status(id,s){let day=g('date').value||today();if(!logs[day])logs[day]={};logs[day][id]=s;save();render()}function call(p){sessionStorage.setItem('lastCall',p.id);location.href='tel:'+p.phone.replace(/[^0-9+]/g,'')}function afterCall(){let id=sessionStorage.getItem('lastCall');if(!id)return;sessionStorage.removeItem('lastCall');let p=people.find(x=>x.id===id);if(!p)return;setTimeout(()=>{if(confirm(p.name+' से बात हुई?\nOK = 🟢 बात हुई\nCancel = 🔴 बात नहीं हुई'))status(id,'yes');else status(id,'no')},300)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)afterCall()});window.addEventListener('focus',afterCall);function makeBtn(label,cls,fn,active){let b=document.createElement('button');b.textContent=label;b.className=cls+(active?' chosen':'');b.onclick=fn;return b}function render(){let day=g('date').value||today(),states=logs[day]||{},q=g('search').value.toLowerCase(),yes=0,no=0;people.forEach(p=>{if(states[p.id]==='yes')yes++;if(states[p.id]==='no')no++});g('total').textContent=people.length;g('yes').textContent=yes;g('no').textContent=no;g('left').textContent=people.length-yes-no;let box=g('list');box.replaceChildren();let found=people.filter(p=>(p.name+' '+p.village+' '+p.phone).toLowerCase().includes(q));if(!found.length){let p=document.createElement('p');p.textContent=people.length?'कोई व्यक्ति नहीं मिला':'ऊपर से व्यक्ति जोड़ें। 50 से ज्यादा भी जोड़ सकते हैं।';box.append(p)}found.forEach(p=>{let d=document.createElement('div');d.className='person';let title=document.createElement('strong');title.textContent=p.name;let sub=document.createElement('div');sub.className='sub';sub.textContent='गाँव: '+p.village+' | '+p.phone;let actions=document.createElement('div');actions.className='actions';actions.append(makeBtn('📞 कॉल','',()=>call(p)),makeBtn('🟢 बात हुई','green',()=>status(p.id,'yes'),states[p.id]==='yes'),makeBtn('🔴 नहीं हुई','red',()=>status(p.id,'no'),states[p.id]==='no'),makeBtn('✏️ बदलें','gray',()=>{let n=prompt('नाम',p.name);if(n===null)return;let v=prompt('गाँव',p.village);if(v===null)return;let t=prompt('नंबर',p.phone);if(t===null)return;if(!n.trim()||!v.trim()||!t.trim()){alert('सभी जानकारी भरें');return}p.name=n.trim();p.village=v.trim();p.phone=t.trim();save();render()}),makeBtn('हटाएँ','gray',()=>{if(confirm(p.name+' को हटाएँ?')){people=people.filter(x=>x.id!==p.id);save();render()}}));d.append(title,sub,actions);box.append(d)})}g('form').onsubmit=e=>{e.preventDefault();let name=g('name').value.trim(),village=g('village').value.trim(),phone=g('phone').value.trim();if(!name||!village||!/^[0-9+ ()-]{7,18}$/.test(phone)){alert('सही नाम, गाँव और मोबाइल नंबर भरें');return}people.push({id:Date.now()+'_'+Math.random(),name,village,phone});if(save()){g('form').reset();render()}};g('search').oninput=render;g('date').onchange=render;function download(filename,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}g('csv').onclick=()=>{let rows=[['तारीख','नाम','गाँव','मोबाइल','स्थिति']];Object.keys(logs).sort().forEach(day=>people.forEach(p=>{let s=logs[day][p.id];if(s)rows.push([day,p.name,p.village,p.phone,s==='yes'?'बात हुई':'बात नहीं हुई'])}));download('daily-call-records.csv','\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};g('backup').onclick=()=>download('daily-call-backup.json',JSON.stringify({people,logs},null,2),'application/json');render()})();
</script></body></html>
